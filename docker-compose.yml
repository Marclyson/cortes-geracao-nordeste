# Airflow 3 com LocalExecutor e um Postgres que guarda dois bancos:
#   airflow  metadados do Airflow
#   dw       dados do projeto (schemas raw, staging, marts)
# Senhas e chaves ficam no .env, gerado por scripts/criar_env.py (fora do Git).
# Tudo escuta só em 127.0.0.1: Airflow em http://localhost:8080, Postgres na porta 5433.

x-airflow: &airflow
  image: apache/airflow:3.3.2-python3.12
  env_file: .env
  user: "50000:0"
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/airflow
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DEFAULT_TIMEZONE: America/Sao_Paulo
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    # ambiente local de estudo: sem tela de login, todo visitante de localhost é administrador
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"
    AIRFLOW__DAG_PROCESSOR__REFRESH_INTERVAL: "30"
    AIRFLOW_CONN_DW: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/dw
  volumes:
    - ./dags:/opt/airflow/dags
    - ./dados:/opt/airflow/dados
    - ./logs:/opt/airflow/logs
  depends_on: &airflow-depends
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:17.11
    env_file: .env
    volumes:
      - postgres:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  airflow-init:
    <<: *airflow
    command: ["db", "migrate"]
    restart: "no"

  airflow-apiserver:
    <<: *airflow
    command: ["api-server"]
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      <<: *airflow-depends
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/version"]
      interval: 15s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow
    command: ["scheduler"]
    depends_on:
      <<: *airflow-depends
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  airflow-dag-processor:
    <<: *airflow
    command: ["dag-processor"]
    depends_on:
      <<: *airflow-depends
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres:
