name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sql:
    name: Lint do SQL
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - run: pip install -r requirements-ci.txt
      - run: sqlfluff lint dbt/models dbt/tests

  dags:
    name: DAGs e carga
    runs-on: ubuntu-latest
    env:
      AIRFLOW_HOME: ${{ github.workspace }}/.airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          # as versões deste job estão no próprio workflow
          cache-dependency-path: .github/workflows/ci.yml
      - name: Instala o Airflow com as restrições oficiais da versão
        run: >
          pip install "apache-airflow==3.3.2" apache-airflow-providers-postgres pyarrow pytest==9.2.0
          --constraint https://raw.githubusercontent.com/apache/airflow/constraints-3.3.2/constraints-3.12.txt
      - run: pytest -q tests

  dbt:
    name: dbt build na amostra
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_USER: ci
          POSTGRES_DB: dw
          # banco descartável, que só existe durante este job: entra sem senha
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_USER: ci
      POSTGRES_PASSWORD: ""
      DBT_HOST: localhost
      DBT_PORT: "5432"
      DBT_PROFILES_DIR: ${{ github.workspace }}/dbt
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - run: pip install -r requirements-ci.txt
      - name: Carrega a amostra no raw com a função da carga
        run: python scripts/carregar_amostra.py
      - name: dbt build completo
        run: dbt build --project-dir dbt
      - name: dbt build de novo, agora incremental
        run: dbt build --project-dir dbt
